[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vfs-platform-console"
version = "0.2.0"
description = "Modular web console for VFS Platform components."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VFS Platform Console contributors" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28.1",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
vfs-platform-console = "vfs_platform_console.main:main"
vfs-platform-debugger = "vfs_platform_console.debugger:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/vfs_platform_console"]
